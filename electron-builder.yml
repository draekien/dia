appId: com.draekien.dia
productName: dia
copyright: Copyright © 2026 William Pei

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - plugins/**
  - package.json
  - '!**/*.map'
  # dia runs the user's own Claude Code install (ADR-0037), so the SDK's bundled platform
  # binary, which the SDK still installs as an optional dependency, is left out of the app.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'

# The Agent SDK ships native helper binaries (ripgrep, etc.) that it spawns as child
# processes. Binaries cannot be executed from inside an asar archive, so this package must be
# unpacked to app.asar.unpacked at install time.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/esbuild/**
  - node_modules/@esbuild/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: draekien
  repo: dia
  releaseType: release
